<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Despliegue Operativo FIFA 26</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b0c10; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1f2833; border-radius: 15px; border: 1px solid #c5a059; margin-bottom: 30px; position: relative; }
        .header-card { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid #c5a059; }
        .header-card h1 { color: #c5a059; font-size: 20px; text-transform: uppercase; font-weight: 800; }
        .poster-img { width: 130px; margin: 15px auto; display: block; border: 2px solid #c5a059; border-radius: 8px; }
        
        /* Tabla de Totales */
        .summary-table { width: 90%; margin: 15px auto; border-collapse: collapse; font-size: 10px; color: #fff; border: 1px solid #c5a059; }
        .summary-table td { padding: 5px; border: 1px solid #c5a059; text-align: center; }
        .summary-table tr:first-child { background: #161b22; color: #c5a059; font-weight: bold; }

        .screen { display: none; } .screen.active { display: block; }
        .main-menu-btn { display: block; width: 90%; margin: 10px auto; padding: 15px; border-radius: 8px; font-weight: 800; text-align: center; text-decoration: none; color: #000; background: linear-gradient(135deg, #e0e0e0, #b0c4de); border: 2px solid #c5a059; text-transform: uppercase; }
        .area-btn { display: flex; justify-content: space-between; align-items: center; width: 90%; margin: 0 auto 10px; padding: 12px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: bold; text-transform: uppercase; text-decoration: none; }
        .dir-item { background: #11141a; padding: 10px; margin: 0 10px 10px; border-left: 4px solid #c5a059; display: flex; justify-content: space-between; align-items: center; }
        .dir-info strong { display: block; font-size: 11px; }
        .dir-info span { font-size: 9px; color: #8892b0; display: block; }
        .dir-zone { font-size: 9px; color: #c5a059; background: #222; padding: 2px 5px; border-radius: 3px; border: 1px solid #c5a059; display: inline-block; margin-top: 3px; }
        .wa-btn { background: #c5a059; color: #000; padding: 5px 8px; border-radius: 4px; text-decoration: none; font-size: 10px; font-weight: 800; }
        .back-btn { display: block; width: 90%; margin: 15px auto; padding: 12px; background: #455e89; color: #fff; text-align: center; border-radius: 6px; text-decoration: none; font-weight: 800; }
        .detail-card { background: #11141a; padding: 15px; margin: 20px; border-radius: 10px; border: 1px solid #c5a059; }
        .details-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; color: #fff; }
        .details-table th, .details-table td { border: 1px solid #333; padding: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="home-screen" class="screen active">
        <div class="header-card">
            <h1>Operativo FIFA 26</h1>
            <p style="font-size: 12px; margin-top:5px;">8 de Junio 2026 | Parque Fundidora</p>
        </div>
        <img src="poster.jpg" alt="Póster" class="poster-img">
        <a href="#" class="main-menu-btn" onclick="showScreen('directory-screen')">Directorio de Mandos</a>
        <a href="#" class="main-menu-btn" onclick="showScreen('deployment-screen')">Despliegue de Zonas</a>
        
        <table class="summary-table">
            <tr><td>Mando</td><td>F.C</td><td>Cadetes</td><td>G.A.E</td><td>CRP</td><td>TOTAL</td></tr>
            <tr><td>18</td><td>142</td><td>250</td><td>50</td><td>5</td><td><strong>465</strong></td></tr>
        </table>
    </div>

    <div id="directory-screen" class="screen">
        <a href="#" class="back-btn" onclick="showScreen('home-screen')">Volver al Inicio</a>
        <div style="padding: 10px;">
            <div class="dir-item"><div class="dir-info"><strong>Jesus Ruiz Felix</strong><span>Subinspector • U.E.S.G</span><div class="dir-zone">Zona: Centro de mando</div></div><a href="https://wa.me/528120657242" class="wa-btn">WA</a></div>
            </div>
    </div>

    <div id="deployment-screen" class="screen">
        <div style="padding: 10px;">
            <a href="#" class="back-btn" onclick="showScreen('home-screen')">Volver al Inicio</a>
            <a href="#" class="area-btn" style="background:#264653;" data-name="Centro de Mando" data-map="centro_de_mando.jpg" data-mando="1" data-fc="11" data-total="12" data-mando-name="JESUS RUIZ FELIX" onclick="showDetail(this)">Centro de Mando</a>
            <a href="#" class="area-btn" style="background:#2a9d8f;" data-name="UCM" data-map="centro_de_mando.jpg" data-mando="1" data-fc="100" data-total="121" data-mando-name="FIDEL DIAZ RUIZ" onclick="showDetail(this)">UCM</a>
            </div>
    </div>

    <div id="detail-screen" class="screen">
        <div class="detail-card">
            <img id="zone-map" src="" style="width:100%; border-radius:5px; display:none;">
            <div id="zone-title" style="font-weight:bold; color:#c5a059; margin-top:10px;"></div>
            <div style="font-size:11px; margin-top:5px;">Mando: <strong id="v-mando-name"></strong></div>
            <table class="details-table">
                <tr><th>Mando</th><th>F.C</th><th>Total</th></tr>
                <tr><td id="v-mando">-</td><td id="v-fc">-</td><td id="v-total">-</td></tr>
            </table>
            <a href="#" class="back-btn" onclick="showScreen('deployment-screen')">Regresar a Zonas</a>
        </div>
    </div>
</div>

<script>
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
    function showDetail(el) {
        document.getElementById('zone-title').innerText = el.getAttribute('data-name');
        document.getElementById('v-mando-name').innerText = el.getAttribute('data-mando-name');
        document.getElementById('v-mando').innerText = el.getAttribute('data-mando');
        document.getElementById('v-fc').innerText = el.getAttribute('data-fc');
        document.getElementById('v-total').innerText = el.getAttribute('data-total');
        let m = document.getElementById('zone-map'); m.src = el.getAttribute('data-map'); m.style.display = 'block';
        showScreen('detail-screen');
    }
</script>
</body>
</html>
