<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Despliegue Operativo FIFA 26</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1f2833; border-radius: 15px; border: 1px solid #c5a059; margin-bottom: 30px; position: relative; }
        .header-card { background-color: #000; padding: 20px; text-align: center; border-bottom: 3px solid #c5a059; }
        .header-card h1 { color: #c5a059; font-size: 18px; text-transform: uppercase; }
        .poster-img { width: 120px; margin: 15px auto; display: block; border: 2px solid #c5a059; border-radius: 8px; }
        .screen { display: none; } .screen.active { display: block; }
        .floating-back-btn { position: absolute; top: 15px; right: 15px; background: #455e89; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 10px; text-transform: uppercase; text-decoration: none; }
        .main-menu-btn { display: block; width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 10px; font-weight: 800; text-transform: uppercase; text-decoration: none; color: #1f2833; background: linear-gradient(135deg, #e0e0e0, #b0c4de); border: 2px solid #c5a059; text-align: center; }
        
        /* Botones de Zonas con Colores Diferentes */
        .area-btn { width: 100%; padding: 14px; margin-bottom: 8px; border-radius: 6px; color: white; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; text-decoration: none; }
        
        /* Directorio */
        .dir-item { background: #11141a; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 3px solid #c0c0c0; }
        .dir-info strong { display: block; color: #fff; font-size: 12px; }
        .dir-info span { color: #8892b0; font-size: 10px; display: block; }
        .dir-zone { color: #c5a059; font-size: 10px; font-weight: 700; background: rgba(197, 160, 89, 0.1); padding: 3px 6px; border: 1px solid #c5a059; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .wa-btn { background: #c5a059; color: #000; padding: 5px 8px; border-radius: 4px; text-decoration: none; font-size: 10px; font-weight: 800; float: right; }
        
        /* Tablas y Detalle */
        .details-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 15px 0; color: #fff; }
        .details-table th, .details-table td { padding: 8px; text-align: center; border: 1px solid #333; }
        .detail-card { background: #11141a; padding: 15px; border-radius: 10px; border: 1px solid #c5a059; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card"><h1>Operativo FIFA 26</h1></div>

    <div id="home-screen" class="screen active">
        <img src="poster.jpg" alt="Póster" class="poster-img">
        <div style="padding:20px;">
            <a href="#" class="main-menu-btn" onclick="showScreen('directory-screen')">Directorio de Mandos</a>
            <a href="#" class="main-menu-btn" onclick="showScreen('deployment-screen')">Despliegue de Zonas</a>
        </div>
    </div>

    <div id="directory-screen" class="screen">
        <div style="padding:20px;">
            <a href="#" class="floating-back-btn" onclick="showScreen('home-screen')">Volver</a>
            <div style="color: #c5a059; font-weight: bold; margin-bottom: 15px;">Directorio</div>
            <div class="dir-item">
                <a href="https://wa.me/528120657242" class="wa-btn">WA</a>
                <div class="dir-info"><strong>Jesus Ruiz Felix</strong><span>Subinspector • U.E.S.G</span><div class="dir-zone">Zona: Centro de mando</div></div>
            </div>
            </div>
    </div>

    <div id="deployment-screen" class="screen">
        <div style="padding:20px;">
            <a href="#" class="floating-back-btn" onclick="showScreen('home-screen')">Volver</a>
            <div style="color: #c5a059; font-weight: bold; margin-bottom: 15px;">Zonas</div>
            <a href="#" class="area-btn" style="background:#264653;" data-name="Centro de Mando" data-map="centro_de_mando.jpg" data-mando="1" data-fc="11" data-cad="0" data-gae="0" data-crp="0" data-total="12" data-mando-name="JESUS RUIZ FELIX" onclick="showDetail(this)">Centro de Mando</a>
            <a href="#" class="area-btn" style="background:#2a9d8f;" data-name="UCM" data-map="centro_de_mando.jpg" data-mando="1" data-fc="100" data-cad="20" data-gae="0" data-crp="0" data-total="121" data-mando-name="FIDEL DIAZ RUIZ" onclick="showDetail(this)">UCM</a>
            <a href="#" class="area-btn" style="background:#e9c46a; color:#000;" data-name="Tecnología" data-map="centro_de_mando.jpg" data-mando="1" data-fc="6" data-cad="0" data-gae="0" data-crp="0" data-total="7" data-mando-name="BENJAMÍN LÓPEZ" onclick="showDetail(this)">Tecnología</a>
            <a href="#" class="area-btn" style="background:#f4a261;" data-name="Escenario" data-map="escenario.jpg" data-mando="1" data-fc="0" data-cad="35" data-gae="0" data-crp="0" data-total="36" data-mando-name="DAVID QUIJAS LÓPEZ" onclick="showDetail(this)">Escenario</a>
            </div>
    </div>

    <div id="detail-screen" class="screen">
        <div style="padding:20px;">
            <a href="#" class="floating-back-btn" onclick="showScreen('deployment-screen')">Zonas</a>
            <div class="detail-card">
                <img id="zone-map" src="" style="width:100%; border-radius:8px; display:none;">
                <div id="zone-title" style="color:#c5a059; font-weight:bold; margin:10px 0;"></div>
                <div style="font-size:12px;">Mando: <strong id="val-mando-name"></strong></div>
                <table class="details-table">
                    <tr><th>M</th><th>FC</th><th>Cad</th><th>GAE</th><th>CRP</th></tr>
                    <tr><td id="v-mando">-</td><td id="v-fc">-</td><td id="v-cad">-</td><td id="v-gae">-</td><td id="v-crp">-</td></tr>
                </table>
            </div>
            <a href="#" class="main-menu-btn" style="margin-top:20px;" onclick="showScreen('deployment-screen')">Regresar</a>
        </div>
    </div>
</div>

<script>
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
    function showDetail(el) {
        document.getElementById('zone-title').innerText = el.getAttribute('data-name');
        document.getElementById('val-mando-name').innerText = el.getAttribute('data-mando-name');
        document.getElementById('v-mando').innerText = el.getAttribute('data-mando');
        document.getElementById('v-fc').innerText = el.getAttribute('data-fc');
        document.getElementById('v-cad').innerText = el.getAttribute('data-cad');
        document.getElementById('v-gae').innerText = el.getAttribute('data-gae');
        document.getElementById('v-crp').innerText = el.getAttribute('data-crp');
        let m = document.getElementById('zone-map'); m.src = el.getAttribute('data-map'); m.style.display = 'block';
        showScreen('detail-screen');
    }
</script>
</body>
</html>
