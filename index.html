<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Despliegue Operativo FIFA 26</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; }
        .container { width: 100%; max-width: 600px; background: #1f2833; border-radius: 15px; border: 1px solid #c5a059; margin-bottom: 30px; position: relative; }
        .header-card { background-color: #000; padding: 25px 20px; text-align: center; border-bottom: 3px solid #c5a059; }
        .header-card h1 { color: #c5a059; font-size: 20px; text-transform: uppercase; font-weight: 800; margin-bottom: 10px; }
        .poster-img { width: 130px; margin: 15px auto; display: block; border: 2px solid #c5a059; border-radius: 8px; }
        .screen { display: none; } .screen.active { display: block; }
        .floating-back-btn { position: absolute; top: 15px; right: 15px; background: #455e89; color: #fff; padding: 6px 10px; border-radius: 5px; font-size: 11px; text-transform: uppercase; text-decoration: none; z-index: 100; }
        .main-menu-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 10px; font-weight: 800; text-transform: uppercase; text-decoration: none; color: #1f2833; background: linear-gradient(135deg, #e0e0e0, #b0c4de); border: 2px solid #c5a059; }
        .area-btn { width: 100%; padding: 14px; margin-bottom: 8px; border-radius: 6px; color: white; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; text-decoration: none; background-color: #455e89; }
        .total-badge { background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 20px; font-size: 10px; }
        .dir-item { background: #11141a; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 3px solid #c0c0c0; }
        .dir-info strong { display: block; color: #fff; font-size: 12px; text-transform: uppercase; }
        .dir-info span { color: #8892b0; font-size: 10px; display: block; }
        .dir-zone { color: #c5a059; font-size: 10px; font-weight: 700; background: rgba(197, 160, 89, 0.1); padding: 3px 6px; border: 1px solid #c5a059; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .wa-btn { background: #c5a059; color: #000; padding: 5px 8px; border-radius: 4px; text-decoration: none; font-size: 10px; font-weight: 800; float: right; }
        .total-general-card { background: #c5a059; color: #000; width: 100%; padding: 10px; text-align: center; font-weight: 800; text-transform: uppercase; margin-top: 15px; }
        .total-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #161b22; padding: 10px; }
        .total-box { text-align: center; padding: 5px; background: #1f2833; border: 1px solid #c5a059; border-radius: 4px; }
        .total-box span { display: block; font-size: 9px; color: #8892b0; }
        .total-box strong { font-size: 13px; color: #c5a059; }
        .detail-card { background: #11141a; padding: 20px; border-radius: 10px; border: 1px solid #c5a059; margin-top: 20px; }
        .details-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 15px 0; color: #fff; }
        .details-table th, .details-table td { padding: 8px; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card"><h1>Operativo FIFA 26</h1></div>

    <div id="home-screen" class="screen active">
        <img src="poster.jpg" alt="Póster" class="poster-img">
        <div style="padding:20px;">
            <a href="#" class="main-menu-btn" onclick="showScreen('directory-screen')">Directorio de Mandos</a>
            <a href="#" class="main-menu-btn" onclick="showScreen('deployment-screen')">Despliegue de Zonas</a>
            <div class="total-general-card">Total General: 460 Elementos</div>
        </div>
    </div>

    <div id="directory-screen" class="screen">
        <div style="padding:20px;">
            <a href="#" class="floating-back-btn" onclick="showScreen('home-screen')">Volver</a>
            <div class="dir-item">
                <a href="https://wa.me/528120657242" class="wa-btn">WA</a>
                <div class="dir-info"><strong>Jesus Ruiz Felix</strong><span>Subinspector • U.E.S.G</span><div class="dir-zone">Zona: Centro de mando</div></div>
            </div>
            </div>
    </div>

    <div id="deployment-screen" class="screen">
        <div style="padding:20px;">
            <a href="#" class="floating-back-btn" onclick="showScreen('home-screen')">Volver</a>
            <a href="#" class="area-btn" data-name="Centro de Mando" data-map="centro_de_mando.jpg" data-mando="1" data-fc="11" data-total="12" onclick="showDetail(this)">Centro de Mando</a>
            <a href="#" class="area-btn" data-name="Acceso 5 Cerrado" data-map="acceso_5.jpg" data-mando="1" data-fc="0" data-total="11" onclick="showDetail(this)">Acceso 5 Cerrado</a>
            <a href="#" class="area-btn" data-name="Binomios Santa Lucia" data-map="paseo_santa_lucia.jpg" data-mando="1" data-fc="0" data-total="46" onclick="showDetail(this)">Binomios Santa Lucia</a>
            </div>
    </div>

    <div id="detail-screen" class="screen">
        <div style="padding:20px;">
            <a href="#" class="floating-back-btn" onclick="showScreen('deployment-screen')">Zonas</a>
            <div class="detail-card">
                <img id="zone-map" src="" style="width:100%; border-radius:8px; display:none;">
                <div id="zone-title" style="color:#c5a059; font-weight:bold; margin:10px 0;"></div>
                <table class="details-table">
                    <tr><th>Mando</th><th>F.C</th><th>Total</th></tr>
                    <tr><td id="v-mando">-</td><td id="v-fc">-</td><td id="v-total">-</td></tr>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
    function showDetail(el) {
        document.getElementById('zone-title').innerText = el.getAttribute('data-name');
        document.getElementById('v-mando').innerText = el.getAttribute('data-mando');
        document.getElementById('v-fc').innerText = el.getAttribute('data-fc');
        document.getElementById('v-total').innerText = el.getAttribute('data-total');
        let m = document.getElementById('zone-map'); m.src = el.getAttribute('data-map'); m.style.display = 'block';
        showScreen('detail-screen');
    }
</script>
</body>
</html>
