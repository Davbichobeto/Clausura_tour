<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Despliegue Operativo FIFA 26</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b0c10; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1f2833; border-radius: 15px; border: 1px solid #c5a059; }
        .screen { display: none; padding: 20px; } .screen.active { display: block; }
        .area-btn { display: block; width: 90%; margin: 0 auto 10px; padding: 12px; border-radius: 6px; color: #fff; background: #455e89; text-align: center; text-decoration: none; font-size: 12px; font-weight: bold; }
        .dir-item { background: #11141a; padding: 10px; margin-bottom: 10px; border-left: 4px solid #c5a059; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .detail-card { background: #11141a; padding: 15px; border-radius: 10px; border: 1px solid #c5a059; }
        #lista-elementos { list-style: none; font-size: 11px; color: #fff; max-height: 200px; overflow-y: auto; background: #000; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="home-screen" class="screen active">
        <h1>Operativo FIFA 26</h1>
        <button onclick="showScreen('directory-screen')">Directorio</button>
        <button onclick="showScreen('deployment-screen')">Despliegue</button>
    </div>

    <div id="directory-screen" class="screen">
        <button onclick="showScreen('home-screen')">Volver</button>
        <div id="lista-directorio">
            <div class="dir-item"><div><strong>Jesus Ruiz Felix</strong><br>Centro de Mando</div><a href="https://wa.me/528120657242">WA</a></div>
            <div class="dir-item"><div><strong>Luis Antonio Garcias</strong><br>Catering</div><a href="https://wa.me/526145140975">WA</a></div>
            </div>
    </div>

    <div id="deployment-screen" class="screen">
        <button onclick="showScreen('home-screen')">Volver</button>
        <div style="margin-top: 20px;">
            <a href="#" class="area-btn" data-name="ESCENARIO" data-pdf="ESCENARIO.pdf" onclick="showDetail(this)">Escenario</a>
            <a href="#" class="area-btn" data-name="SANTA LUCIA" data-pdf="SANTA_LUCIA.pdf" onclick="showDetail(this)">Santa Lucia</a>
            <a href="#" class="area-btn" data-name="UCM" data-pdf="UCM.pdf" onclick="showDetail(this)">UCM</a>
        </div>
    </div>

    <div id="detail-screen" class="screen">
        <div class="detail-card">
            <h2 id="zone-title"></h2>
            <h3>Elementos Asignados:</h3>
            <ul id="lista-elementos"></ul>
            <a id="btn-pdf" href="#" target="_blank">Abrir PDF Original</a>
            <br><button onclick="showScreen('deployment-screen')">Regresar</button>
        </div>
    </div>
</div>

<script>
    // BASE DE DATOS EXTRAÍDA DE TU CSV
    const baseDeDatos = {
        "ESCENARIO.pdf": ["AGUSTIN RONQUILLO JOSE ARMANDO", "ALONSO MARTINEZ ANA MARIA DENIS", "ANAYA NICANDRO JOSE FERNANDO", "BARRIOS MONZON ANGEL ULISES", "BAUTISTA HERNANDEZ JOSE ALBERTO"],
        "SANTA_LUCIA.pdf": ["MARIA DEL SOCORRO LOPEZ RODRIGUEZ", "ANABEL PARRA PEREZ", "PATRICIA ARROYO CASTILLO", "JACQUELINE CORTES DIMAS"],
        "UCM.pdf": ["RAMIREZ NICOLAS GELACIO", "RAMIREZ RODRIGUEZ LESLIE ALESSANDRA"]
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showDetail(el) {
        let archivo = el.getAttribute('data-pdf');
        document.getElementById('zone-title').innerText = el.getAttribute('data-name');
        document.getElementById('btn-pdf').href = archivo;

        let lista = document.getElementById('lista-elementos');
        lista.innerHTML = "";
        
        if (baseDeDatos[archivo]) {
            baseDeDatos[archivo].forEach(nombre => {
                let li = document.createElement('li');
                li.innerText = "• " + nombre;
                lista.appendChild(li);
            });
        }
        showScreen('detail-screen');
    }
</script>
</body>
</html>
